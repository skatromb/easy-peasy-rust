version: 2
updates:
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    assignees: [skatromb]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
