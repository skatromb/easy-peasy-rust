let_underscore_drop = "1.74"
macro_use_extern_crate = "1.74"
meta_variable_misuse = "1.74"
missing_copy_implementations = "1.74"
missing_docs = "1.74"
non_ascii_idents = "1.74"
raw_borrows_via_references = "1.99"
redundant_imports = "1.82"
redundant_lifetimes = "1.79"
single_use_lifetimes = "1.74"
trivial_casts = "1.74"
trivial_numeric_casts = "1.74"
unit_bindings = "1.76"
