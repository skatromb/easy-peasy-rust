# Breaking public APIs
avoid-breaking-exported-api = false # ~20 lints for `pub` items, even if they could break API.

# Tests may panic and print. Shipped code may not, see "Don't panic" in lints.toml
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# Names, from wemake-python-styleguide WPS110 and WPS111, see external/wps_mapping.md
allowed-idents-below-min-chars = [] # WPS111 allows none either.
check-inconsistent-struct-field-initializers = true # Struct literals list fields in definition order.
disallowed-names = [
    "arr", "args", "bar", "baz", "content", "contents", "data", "foo", "ham", "handle", "handler",
    "info", "item", "items", "no", "obj", "object", "objects", "objs", "param", "params",
    "parameters", "result", "results", "some", "spam", "temp", "tmp", "val", "vals", "value",
    "values", "var", "variable", "vars", "wrapper", "yes",
] # WPS110, rewritten for Rust.
min-ident-chars-threshold = 2 # Stricter than WPS111: flags 2-char names like `id` too.
upper-case-acronyms-aggressive = true # `XmlParser` over `XMLParser`, not only `Http` over `HTTP`.

# Complexity thresholds, from wemake-python-styleguide WPS2xx and WPS425
cognitive-complexity-threshold = 12 # WPS231.
excessive-nesting-threshold = 4 # WPS220 is 5.
max-fn-params-bools = 0 # WPS425: no keyword arguments, so no bool parameters.
too-many-arguments-threshold = 4 # WPS211 is 5. Clippy counts `self`, so methods get 3.
too-many-lines-threshold = 20 # Stands in for WPS213, 9 expressions.
type-complexity-threshold = 75 # Depth 3, as WPS234.

# Left at clippy's default:
# - absolute-paths-allowed-crates = []: every crate alike.
# - absolute-paths-max-segments = 2: `use std::fs;` then `fs::read`, not `std::fs::read`.
# - accept-comment-above-attributes = true: `unsafe_code` is denied.
# - accept-comment-above-statement = true: `unsafe_code` is denied.
# - allow-comparison-to-zero = true: `x % 2 == 0` holds for negative `x` too.
# - allow-exact-repetitions = true: `config::Config` is idiomatic.
# - allow-expect-in-consts = true: a panic there fails the build, not the run.
# - allow-unwrap-in-consts = true: a panic there fails the build, not the run.
# - allow-renamed-params-for = ["core::convert::From", "core::convert::TryFrom", "core::str::FromStr"]: `From` impls may rename `value`, a disallowed name.
# - allow-unwrap-types = []: `lock().unwrap_or_else(PoisonError::into_inner)` does not panic.
# - allowed-prefixes = ["to", "as", "into", "from", "try_into", "try_from"]: `to_config` in `config` reads fine.
# - allowed-scripts = ["Latin"]: as WPS119.
# - arithmetic-side-effects-allowed = []: for your own overflow-safe types.
# - arithmetic-side-effects-allowed-binary = []: for your own overflow-safe types.
# - arithmetic-side-effects-allowed-unary = []: for your own overflow-safe types.
# - check-private-items = false: no `# Errors` docs on private items, as `missing_docs_in_private_items`.
# - inherent-impl-lint-scope = "crate": one `impl` block per type.
# - literal-representation-threshold = 16384: hex only for big literals that read better in it.
# - max-include-file-size = 1000000: 1 MB is enough for fixtures.
# - min-ident-chars-lint-trait-impl = false: renaming `f` in `fmt(&self, f)` trips `renamed_function_params`.
# - semicolon-inside-block-ignore-singleline = false: one rule for every block.
# - semicolon-outside-block-ignore-multiline = false: one rule for every block.
# - suppress-restriction-lint-in-const = false: it also silences `const fn`, which can panic at runtime.
