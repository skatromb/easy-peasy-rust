# easy-peasy: Public API
avoid-breaking-exported-api = false # ~20 lints that may ask to break a `pub` API.

# easy-peasy: Minimal supported Rust version
check-incompatible-msrv-in-tests = true # Tests build on the minimum Rust version too.

# easy-peasy: Tests may panic and print
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# easy-peasy: Naming
allowed-idents-below-min-chars = [] # WPS111 allows none either.
check-inconsistent-struct-field-initializers = true # Struct literals list fields in definition order.
disallowed-names = [
    "arr", "args", "bar", "baz", "content", "contents", "data", "entries", "entry", "foo", "ham",
    "handle", "handler", "info", "item", "items", "no", "obj", "object", "objects", "objs", "param",
    "params", "parameters", "result", "results", "some", "spam", "temp", "tmp", "val", "vals",
    "value", "values", "var", "variable", "vars", "wrapper", "yes",
] # WPS110, rewritten for Rust.
enum-variant-name-threshold = 2 # `{ ReadError, WriteError }` says Error twice.
min-ident-chars-threshold = 2 # Stricter than WPS111: flags 2-char names like `id` too.
pub-underscore-fields-behavior = "AllPubFields" # `_name` means unused, so no `pub(crate)` either.
struct-field-name-threshold = 2 # `{ user_id, user_name }` says user twice.
upper-case-acronyms-aggressive = true # `XmlParser` over `XMLParser`, `Http` over `HTTP`.

# easy-peasy: Complexity
cognitive-complexity-threshold = 6 # WPS231. Lint counts complexity very differently.
excessive-nesting-threshold = 4 # WPS220 is 5.
lint-commented-code = true # A comment does not stop collapsing an `if`, the fix keeps it.
max-fn-params-bools = 0 # WPS425: no keyword arguments, so no bool parameters.
too-many-arguments-threshold = 4 # WPS211 is 5. Clippy counts `self`, so methods get 3.
too-many-lines-threshold = 20 # Stands in for WPS213, 9 expressions.
type-complexity-threshold = 75 # Depth 3, as WPS234.
