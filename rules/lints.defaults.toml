# Lints left at their default level with reason. `easy-peasy` never writes these.

[rust]
# Edition migrations
rust_2018_compatibility = "`cargo fix --edition` turns it on for the migration."
rust_2021_compatibility = "`cargo fix --edition` turns it on for the migration."
rust_2024_compatibility = "`cargo fix --edition` turns it on for the migration."

# Lints
dead_code_pub_in_binary = "A test harness is a binary, so it flags library `pub` items tests skip; `dead_code` covers the rest."
deprecated_in_future = "For std's own deprecations."
elided_lifetimes_in_paths = "`Lifetimes<'_>` everywhere."
linker_info = "Harmless linker chatter, like `ld: ignoring duplicate libraries`."
missing_debug_implementations = "`Debug` on every public type."
unused_crate_dependencies = "Flags dev-dependencies in every target that does not use them."

[clippy]
# Groups
complexity = "Simpler code for the same thing."
correctness = "Outright wrong code fails the build."
perf = "Faster code for the same thing."
restriction = "Picked lint by lint, as clippy advises."
style = "Idiomatic code."
suspicious = "Most likely wrong code."

# Restriction lints
arbitrary_source_item_ordering = "Sorts by name, code reads better top-down."
assertions_on_result_states = "Its fix, `unwrap()`, is denied."
big_endian_bytes = "Big endian, the network order, is the pick."
clone_on_ref_ptr = "`Rc::clone(&x)` over `x.clone()` is noise."
default_numeric_fallback = "A suffix on every literal."
exhaustive_enums = "`#[non_exhaustive]` matters for library semver only."
exhaustive_structs = "Same."
float_arithmetic = "Bans float math."
get_unwrap = "Its fix, indexing, is denied, and `unwrap_used` flags it anyway."
impl_trait_in_params = "Bans `impl Trait` arguments."
implicit_return = "Contradicts `needless_return`."
inline_asm_x86_intel_syntax = "Opposite of `inline_asm_x86_att_syntax`."
inline_trait_bounds = "`where` for every bound."
integer_division_remainder_used = "For constant-time crypto."
let_underscore_must_use = "`let _ =` is how `unused_results` wants a result dropped."
let_underscore_untyped = "`let _: T =` everywhere."
missing_asserts_for_indexing = "Indexing is denied."
missing_docs_in_private_items = "rustc `missing_docs` covers the public API."
missing_inline_in_public_items = "Premature optimisation."
missing_trait_methods = "Defeats default methods."
non_ascii_literal = "Text is Unicode, `non_ascii_idents` guards names."
pattern_type_mismatch = "Fights match ergonomics."
pub_use = "Re-exports shape a public API."
pub_with_shorthand = "Opposite of `pub_without_shorthand`."
question_mark_used = "Bans `?`."
rest_pattern_accessible_field = "`..` in patterns is fine."
self_named_module_files = "Opposite of `mod_module_files`."
semicolon_outside_block = "Opposite of `semicolon_inside_block`."
separated_literal_suffix = "Opposite of `unseparated_literal_suffix`."
single_call_fn = "Small named functions are often called once."
std_instead_of_alloc = "For `no_std`."
std_instead_of_core = "For `no_std`."
