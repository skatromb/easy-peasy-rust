# Settings left at their default value with reason. `easy-peasy` never writes these.

absolute-paths-allowed-crates = "Every crate alike."
absolute-paths-max-segments = "`use std::fs;` then `fs::read`, not `std::fs::read`."
accept-comment-above-attributes = "`unsafe_code` is denied."
accept-comment-above-statement = "`unsafe_code` is denied."
allow-comparison-to-zero = "`x % 2 == 0` holds for negative `x` too."
allow-exact-repetitions = "`config::Config` is idiomatic."
allow-expect-in-consts = "A panic there fails the build, not the run."
allow-large-stack-frames-in-tests = "Test fixtures may be big."
allow-mixed-uninlined-format-args = "No half-inlined format strings."
allow-one-hash-in-raw-strings = "No `#` in raw strings that hold no quote."
allow-private-module-inception = "`foo::foo` says foo twice, private or not."
allow-renamed-params-for = "`From` impls may rename `value`, a disallowed name."
allow-unwrap-in-consts = "A panic there fails the build, not the run."
allow-unwrap-types = "`lock().unwrap_or_else(PoisonError::into_inner)` does not panic."
allow-useless-vec-in-tests = "Tests use arrays too."
allowed-dotfiles = "For your own dotfiles."
allowed-duplicate-crates = "`multiple_crate_versions` is allowed."
allowed-prefixes = "`to_config` in `config` reads fine."
allowed-scripts = "Latin, as WPS119."
allowed-wildcard-imports = "Name what you import."
arithmetic-side-effects-allowed = "For your own overflow-safe types."
arithmetic-side-effects-allowed-binary = "For your own overflow-safe types."
arithmetic-side-effects-allowed-unary = "For your own overflow-safe types."
array-size-threshold = "16 KB on the stack is fine."
await-holding-invalid-types = "For your own types."
cargo-ignore-publish = "Only for testing clippy itself."
check-grouped-late-init = "Also catches `let a; let b; a = 1; b = 2;`."
check-private-items = "No `# Errors` docs on private items, as `missing_docs_in_private_items`."
const-literal-digits-threshold = "Lets generated float tables through."
disallowed-fields = "For your own fields."
disallowed-macros = "For your own macros."
disallowed-methods = "For your own methods."
disallowed-types = "For your own types."
doc-valid-idents = "Append your own words with `..`."
enable-raw-pointer-heuristic-for-send = "`unsafe_code` is denied."
enforce-iter-loop-reborrow = "`for x in &*v` reads worse."
enforced-import-renames = "For your own renames."
enum-variant-size-threshold = "Box only big variants."
future-size-threshold = "Same as `array-size-threshold`."
ignore-interior-mutability = "For your own types."
inherent-impl-lint-scope = "One `impl` block per type."
large-error-ignored = "For your own error types."
large-error-threshold = "Box only big errors."
literal-representation-threshold = "Hex only for big literals that read better in it."
matches-for-let-else = "A `match` on your own enum breaks when a variant is added, `let ... else` does not."
max-include-file-size = "1 MB is enough for fixtures."
max-struct-bools = "Config structs with flags are normal."
max-suggested-slice-pattern-length = "Longer patterns read worse."
max-trait-bounds = "A merged bound longer than 3 traits reads worse than repeated ones."
min-ident-chars-lint-trait-impl = "Renaming `f` in `fmt(&self, f)` trips `renamed_function_params`."
missing-docs-allow-unused = "`missing_docs_in_private_items` is allowed."
missing-docs-in-crate-items = "`missing_docs_in_private_items` is allowed."
module-item-order-groupings = "`arbitrary_source_item_ordering` is allowed."
module-items-ordered-within-groupings = "`arbitrary_source_item_ordering` is allowed."
msrv = "Read from `rust-version` in `Cargo.toml`."
pass-by-value-size-limit = "Copying less than 256 bytes is cheap."
recursive-self-in-type-definitions = "`Box<Self>` in recursive types."
semicolon-inside-block-ignore-singleline = "One rule for every block."
semicolon-outside-block-ignore-multiline = "One rule for every block."
single-char-binding-names-threshold = "`min_ident_chars` bans single-char names already."
source-item-ordering = "`arbitrary_source_item_ordering` is allowed."
stack-size-threshold = "Stack frames up to 500 KB are fine."
standard-macro-braces = "For your own macros."
suppress-restriction-lint-in-const = "It also silences `const fn`, which can panic at runtime."
too-large-for-stack = "Up to 200 bytes needs no `Box` or `vec!`."
trait-assoc-item-kinds-order = "`arbitrary_source_item_ordering` is allowed."
trait-impl-item-order = "`arbitrary_source_item_ordering` is allowed."
trivial-copy-size-limit = "Pass by value up to the pointer size."
unnecessary-box-size = "Return a value under 128 bytes without a `Box`."
unreadable-literal-lint-fractions = "`0.000_001` reads better."
vec-box-size-threshold = "`Vec<T>` over `Vec<Box<T>>` for items up to 4 KB."
verbose-bit-mask-threshold = "`x & 1 == 0` stays, wider masks use `trailing_zeros`."
warn-on-all-wildcard-imports = "`use super::*` in tests and preludes are idiomatic."
warn-unsafe-macro-metavars-in-private-macros = "`unsafe_code` is denied."
