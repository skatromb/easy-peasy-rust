[project]
name = "scraper"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.37",
    "wemake-python-styleguide>=1.8",
]

[tool.uv]
package = false

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = ["ANN", "D100", "FBT", "PLC2701"]
