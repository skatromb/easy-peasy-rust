[package]
name = "easy-peasy-rust"
version = "1.99.1"
edition = "2024"
rust-version = "1.91"
description = "Opinionated clippy and rustc lint preset in the spirit of wemake-python-styleguide"
license = "MIT"
repository = "https://github.com/skatromb/easy-peasy-rust"
keywords = ["cargo", "clippy", "lints", "subcommand"]
categories = ["development-tools::cargo-plugins"]
include = ["/src", "/rules/*.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "cargo-easy-peasy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = "0.25.15"

[dev-dependencies]
rexpect = "0.7.1"
tempfile = "3.27.0"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
blanket_clippy_restriction_lints = "allow"
restriction = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
arithmetic_side_effects = "deny"
cast_abs_to_unsigned = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
assertions_on_result_states = "allow"
big_endian_bytes = "allow"
implicit_return = "allow"
let_underscore_must_use = "allow"
mod_module_files = "deny"
pub_with_shorthand = "allow"
self_named_module_files = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
arbitrary_source_item_ordering = "allow"
impl_trait_in_params = "allow"
missing_trait_methods = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
question_mark_used = "allow"
rest_pattern_accessible_field = "allow"
single_call_fn = "allow"
clone_on_ref_ptr = "allow"
default_numeric_fallback = "allow"
inline_trait_bounds = "allow"
let_underscore_untyped = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
non_ascii_literal = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
float_arithmetic = "allow"
integer_division_remainder_used = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"

[lints.rust]
ffi_unwind_calls = "warn"
raw_borrows_via_references = "warn"
unsafe_code = "deny"
ambiguous_negative_literals = "warn"
deref_into_dyn_supertrait = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
unstable_features = "warn"
unused_results = "warn"
variant_size_differences = "warn"
missing_copy_implementations = "warn"
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
